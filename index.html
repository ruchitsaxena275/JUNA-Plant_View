<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title> SOLAR FARM MAP</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Leaflet Search -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>

  <!-- ================= SEARCH PANEL ================= -->
<div id="search-panel">

  <h3>🔎 String Search</h3>

  <select id="itcSelect"></select>
  <select id="invSelect"></select>
  <select id="scbSelect"></select>
  <select id="stringSelect"></select>

  <button onclick="searchString()">Search String</button>

  <hr>

  <h3>🔎 SCB Search</h3>

  <select id="itcSelectScb"></select>
  <select id="invSelectScb"></select>
  <select id="scbSelectOnly"></select>

  <button onclick="searchSCB()">Search SCB</button>

  <hr>

  <!-- ✅ ROBO SEARCH (MUST BE INSIDE PANEL) -->
  <h3>🤖 Robo Search</h3>

  <input
    type="text"
    id="roboSearchInput"
    placeholder="Enter Robo ID (e.g. 2005)"
    style="width: 160px;"
  />

  <button onclick="searchRobo()">Search Robo</button>

  <hr>

🔎 Tracker Search

<input type="text" id="trackerSearchInput" placeholder="Enter Tracker ID">

<button onclick="searchTracker()">Search Tracker</button>

<br><br>

🔎 Node Search

<input type="text" id="nodeSearchInput" placeholder="Enter Node ID">

<button onclick="searchNode()">Search Node</button>

<hr>

<h3>🧹 Robot Cleaning Data</h3>

<label>Mode</label>
<select id="cleanMode">
<option value="gateway">Gateway Wise</option>
<option value="robot">Robot Wise</option>
</select>

<br><br>

<label>Gateway</label>
<select id="gatewaySelect">
<option value="">Select Gateway</option>
</select>

<br><br>

<label>Robot</label>
<select id="robotSelect">
<option value="">Select Robot</option>
</select>

<br><br>

<button onclick="generateCleaningReport()">Generate Report</button>
<button onclick="downloadCleaningExcel()">Download Excel</button>

<div id="cleanResult" style="margin-top:10px;font-size:13px;"></div>

</div>

  <header>
    <h1>SOLAR FARM MAP🔆</h1>
  </header>

  <div id="map"></div>

  <footer>
    Developed by <b>Ruchit Saxena</b>
  </footer>

  <!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>

<!-- XLSX Library (for Excel download) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="app.js"></script>
</body>
</html>
