<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solar Plant Web Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
html, body {
  height: 100%;
  margin: 0;
}

#map {
  height: 100%;
  width: 100%;
}

/* 🔍 Search Panel */
.search-box {
  position: fixed;
  bottom: 70px;
  left: 10px;
  right: 10px;
  background: #ffffff;
  padding: 12px;
  border-radius: 10px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.3);
  z-index: 9999;
  font-size: 13px;
}

.search-box h3 {
  margin: 0 0 6px;
  font-size: 14px;
}

.search-box select {
  width: 100%;
  margin: 5px 0;
  padding: 6px;
}

.search-box label {
  display: block;
  font-size: 12px;
  margin-bottom: 4px;
}
</style>
</head>

<body>

<div id="map"></div>

    ITC → INV → SCB
  </label>

    <option value="">Select ITC</option>
  </select>
