<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBvx1kW617AY4bjKDfGnWF81IrGYZzSoos",
    authDomain: "junasolarmap.firebaseapp.com",
    projectId: "junasolarmap",
    appId: "1:218285140022:web:a237004e191b3539d91097"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const ALLOWED_EMAILS = [
    "rusunsaxena2000@gmail.com"
  ];

  let checked = false;

  auth.onAuthStateChanged(user => {
    if (checked) return;
    checked = true;

    if (!user) {
      window.location.replace("login.html");
      return;
    }

    if (!ALLOWED_EMAILS.includes(user.email)) {
      alert("Access denied");
      auth.signOut();
      window.location.replace("login.html");
    }
  });
</script>
