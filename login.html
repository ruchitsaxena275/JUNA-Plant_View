<!DOCTYPE html>
<html>
<head>
  <title>JUNA Login</title>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 80px;">

  <h2>🔐 JUNA Solar Plant Access</h2>

  <input
    type="email"
    id="email"
    placeholder="Enter your email"
    style="padding:10px; width:260px;"
  />
  <br><br>
  <button onclick="sendLink()" style="padding:10px 20px;">
    Send Login Link
  </button>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBvx1kW617AY4bjKDfGnWF8IlrGYZzS0os",
    authDomain: "junasolarmap.firebaseapp.com",
    projectId: "junasolarmap",
    appId: "1:218285140022:web:a237004e191b3539d91097"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  function sendLink() {
    const email = document.getElementById("email").value;

    const actionCodeSettings = {
      url: window.location.origin + "/JUNA-Plant_View/",
      handleCodeInApp: true
    };

    auth.sendSignInLinkToEmail(email, actionCodeSettings)
      .then(() => {
        localStorage.setItem("emailForSignIn", email);
        alert("Login link sent to your email");
      })
      .catch(err => alert(err.message));
  }

  if (auth.isSignInWithEmailLink(window.location.href)) {
    let email = localStorage.getItem("emailForSignIn");
    if (!email) email = prompt("Confirm your email");

    auth.signInWithEmailLink(email, window.location.href)
      .then(() => {
        window.location.href = "index.html";
      })
      .catch(err => alert(err.message));
  }
</script>

</body>
</html>
