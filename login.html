<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>JUNA Login</title>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>

<body style="font-family:Arial;text-align:center;margin-top:100px;">

<h2>🔐 JUNA Solar Plant Access</h2>

<input type="email" id="email" placeholder="Enter your email" />
<br><br>
<button onclick="sendLink()">Send Login Link</button>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBvx1kW617AY4bjKDfGnWF8IlrGYZzS0os",
    authDomain: "junasolarmap.firebaseapp.com",
    projectId: "junasolarmap",
    appId: "1:218285140022:web:bf8e44b767cc8083d91097"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

  function sendLink() {
    const email = document.getElementById("email").value;

    // 🔴 MAGIC LINK MUST RETURN TO login.html
    const actionCodeSettings = {
      url: "https://ruchitsaxena275.github.io/JUNA-Plant_View/login.html",
      handleCodeInApp: true
    };

    auth.sendSignInLinkToEmail(email, actionCodeSettings)
      .then(() => {
        localStorage.setItem("emailForSignIn", email);
        alert("Login link sent to your email");
      })
      .catch(err => alert(err.message));
  }

  // ✅ MAGIC LINK HANDLING (ONLY HERE)
  if (auth.isSignInWithEmailLink(window.location.href)) {
    let email = localStorage.getItem("emailForSignIn");
    if (!email) email = prompt("Confirm your email");

    auth.signInWithEmailLink(email, window.location.href)
      .then(() => {
        localStorage.removeItem("emailForSignIn");
        window.location.replace("index.html");
      })
      .catch(err => alert(err.message));
  }
</script>

</body>
</html>
